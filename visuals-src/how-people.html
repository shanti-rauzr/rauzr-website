<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="how.css">
<style>
.panel { left: 70px; top: 56px; width: 460px; padding: 20px 22px; }
.back { left: 120px; top: 50px; width: 400px; height: 300px; transform: rotate(3deg); background: #eaf5f2; box-shadow: none; }
.who { display:flex; align-items:center; gap:12px; }
.av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #0f1d33, #2a3c58); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600 }
.f { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; }
.btns { display:flex; gap: 8px; margin-top: 16px }
.btns .chip { padding: 8px 15px }
.sig { margin-top: 16px; display:flex; align-items:center; gap:10px; font-size: 12.5px; color: var(--muted) }
.badge { position:absolute; right: 36px; top: 28px; padding: 10px 14px; display:flex; gap:8px; align-items:center; }
</style></head><body><div class="stage"><div class="grid"></div>
<div class="glow" style="left:180px;top:120px;width:300px;height:200px;background:rgba(20,163,151,.25)"></div>
<div class="card back"></div>
<div class="card panel">
  <div class="who"><div class="av">RA</div><div><div class="t">Your review</div><div class="s">One finding · two cited sources</div></div></div>
  <div class="f"><div style="display:flex;justify-content:space-between"><span class="chip amber" style="font-size:12px">Major</span><span class="chip ghost mono" style="font-size:11.5px">Rule · cited</span></div>
    <div class="lines"><i class="t" style="width:70%;margin-top:14px"></i><i style="width:90%"></i><i style="width:55%"></i></div></div>
  <div class="btns"><span class="chip solid">Agree</span><span class="chip ghost">Dispute</span><span class="chip ghost">Waive with reason</span></div>
  <div class="sig"><svg width="70" height="22" viewBox="0 0 70 22" fill="none" stroke="#0f1d33" stroke-width="1.8" stroke-linecap="round"><path d="M2 16c6-10 10-12 12-6s-2 9 3 3 8-11 10-4 4 6 8 0 6-7 9-1 6 3 10-1 8-2 14-1"/></svg> Decision recorded with name and reason</div>
</div>
<div class="card badge"><span style="width:22px;height:22px;border-radius:50%;background:var(--teal);display:grid;place-items:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M2 6.5l2.6 2.5L10 3"/></svg></span><span class="t" style="font-size:13.5px">Human sign-off</span></div>
</div></body></html>
